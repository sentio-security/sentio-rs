[workspace]
members = [
    "crates/sentio-core",
    "crates/sentio-cli",
]
resolver = "2"

[workspace.package]
version = "0.3.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sentio-security/sentio-rs"
authors = ["sentio-security"]
description = "AST-based security scanner for Anchor programs"
keywords = ["solana", "anchor", "security", "linter", "audit"]
categories = ["development-tools::testing", "command-line-utilities"]
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "3.0.3", features = ["full", "visit"] }
toml = "1.1"
ureq = { version = "3.3.0", features = ["json"] }
uuid = { version = "1.10", features = ["v4"] }
walkdir = "2.5"
